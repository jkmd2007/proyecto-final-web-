services:
  # Aplicación Riul
  app:
    build: .
    # Nombre del contenedor
    container_name: Riul_app
    # localhost:5000 -> contenedor:5000
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: mysql+pymysql://Riul_user:Riul_password@db:3307/Ruil_db
      JWT_SECRET_KEY: super-clave-secret
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.4
    container_name: Riul_db
    environment:
      MYSQL_DATABASE: Ruil_db
      MYSQL_USER: Riul_user
      MYSQL_PASSWORD: Riul_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  mysql_data:
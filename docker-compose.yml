services:
  # Aplicación Riul
  app:
    build: .
    # Nombre del contenedor
    container_name: Riul_app
    # localhost:5000 -> contenedor:5000
    ports:
      - "5000:5000"
    environment:
      # Dentro de la red de Docker MySQL escucha en 3306 (3307 es solo el puerto del host)
      DATABASE_URL: mysql+pymysql://Riul_user:Riul_password@db:3306/Riul_db?charset=utf8mb4
      SECRET_KEY: 30e3b7a1b2eabbad44245a809db4f11b2c67702a570e141b49916371ffa8bd85
      JWT_SECRET_KEY: 30e3b7a1b2eabbad44245a809db4f11b2c67702a570e141b49916371ffa8bd85
      # Administrador inicial (cambia la contraseña en producción)
      ADMIN_EMAIL: admin@unilibre.edu.co
      ADMIN_PASSWORD: Admin2026*
      # 1 = carga semilleros, usuarios y datos de demostración la primera vez
      SEED_DEMO: "1"
      # Solo desarrollo: devuelve el código de recuperación en la respuesta
      # (sin servidor de correo). Ponlo en 0 y configura MAIL_* en producción.
      RESET_CODE_IN_RESPONSE: "1"
    volumes:
      - uploads_data:/app/instance/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.4
    container_name: Riul_db
    environment:
      MYSQL_DATABASE: Riul_db
      MYSQL_USER: Riul_user
      MYSQL_PASSWORD: Riul_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  mysql_data:
  uploads_data:

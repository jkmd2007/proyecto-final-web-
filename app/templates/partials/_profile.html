<section id="profile-screen" class="app-screen hidden space-y-6">

    <article class="rounded-2xl border border-[#d8d7d1] bg-white p-6 shadow-sm">
        <div class="flex flex-col gap-6 lg:flex-row lg:items-center lg:justify-between">

            <div class="flex items-start gap-5">
                <div
                    id="profile-avatar"
                    class="flex h-20 w-20 items-center justify-center rounded-full border border-[#c9c8c2] bg-[#eeeeea] text-xl font-semibold text-[#6b6a66]"
                >
                    PR
                </div>
                <div>
                    <h2 id="profile-name" class="text-2xl font-bold text-[#232321]">Nombre del investigador</h2>
                    <p id="profile-email" class="mt-1 text-sm text-[#6b6a66]">correo@unilibre.edu.co</p>
                    <div class="mt-3 flex flex-wrap gap-2">
                        <span id="profile-role" class="rounded-full bg-[#e6f1fb] px-3 py-1 text-xs font-medium text-[#0c447c]">
                            Estudiante investigador
                        </span>
                        <span id="profile-semilleros" class="flex flex-wrap gap-2"></span>
                    </div>
                    <p id="profile-academic" class="mt-3 text-sm text-[#6b6a66]"></p>
                </div>
            </div>

            <div class="text-right">
                <p id="profile-level" class="text-sm font-medium text-[#6b6a66]">Nivel 1</p>
                <p id="profile-stars" class="mt-1 text-[#c9a227]" aria-label="1 de 5 estrellas">★☆☆☆☆</p>
                <p id="profile-xp-next" class="mt-1 text-xs text-[#8b8a85]"></p>
                <button
                    id="edit-profile"
                    type="button"
                    class="mt-3 rounded-md border border-[#c9c8c2] bg-[#eeeeea] px-5 py-2 text-sm font-medium text-[#3a3a38]"
                >
                    Editar perfil
                </button>
                <button
                    id="download-cv"
                    type="button"
                    class="mt-3 rounded-md border border-[#c9c8c2] bg-[#eeeeea] px-5 py-2 text-sm font-medium text-[#3a3a38]"
                >
                    Descargar hoja de vida
                </button>
            </div>

        </div>
    </article>


    <div class="grid gap-4 md:grid-cols-3">
        <article class="rounded-2xl border border-[#d8d7d1] bg-white p-5 shadow-sm">
            <p class="text-sm text-[#6b6a66]">XP total</p>
            <p id="profile-xp" class="mt-2 text-3xl font-bold">0</p>
        </article>
        <article class="rounded-2xl border border-[#d8d7d1] bg-white p-5 shadow-sm">
            <p class="text-sm text-[#6b6a66]">Insignias</p>
            <p id="profile-badges-count" class="mt-2 text-3xl font-bold">0</p>
        </article>
        <article class="rounded-2xl border border-[#d8d7d1] bg-white p-5 shadow-sm">
            <p class="text-sm text-[#6b6a66]">Publicaciones</p>
            <p id="profile-pubs" class="mt-2 text-3xl font-bold">0</p>
        </article>
    </div>


    <div class="grid gap-6 xl:grid-cols-2">

        <article class="rounded-2xl border border-[#d8d7d1] bg-white p-6 shadow-sm">
            <h3 class="text-lg font-semibold">Hoja de vida investigativa</h3>
            <ul id="profile-cv-list" class="mt-5 space-y-5"></ul>
        </article>


        <article class="rounded-2xl border border-[#d8d7d1] bg-white p-6 shadow-sm">
            <h3 class="text-lg font-semibold">Insignias obtenidas</h3>
            <div id="profile-badges" class="mt-6 grid grid-cols-3 gap-6 text-center"></div>
        </article>

    </div>

</section>

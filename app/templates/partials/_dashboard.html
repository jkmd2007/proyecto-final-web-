<section id="dashboard-screen" class="app-screen space-y-6">

    <div class="rounded-2xl bg-white p-6 shadow-sm">
        <p class="text-xs font-semibold uppercase tracking-[0.2em] text-[#0c447c]">
            Bienvenido
        </p>
        <h2 id="dashboard-username" class="mt-3 text-3xl font-bold text-[#232321]">
            Investigador
        </h2>
        <p class="mt-2 text-[#6b6a66]">
            Consulta semilleros, proyectos, publicaciones y tu hoja de vida investigativa.
        </p>

        <div class="relative mt-6">
            <input
                id="search-input"
                type="search"
                placeholder="Buscar semilleros, proyectos o publicaciones..."
                class="w-full rounded-full border border-[#c9c8c2] px-5 py-3"
            >
        </div>
    </div>


    <div class="grid gap-4 md:grid-cols-3">

        <div class="rounded-2xl bg-white p-6 shadow-sm">
            <p class="text-sm text-[#6b6a66]">Semilleros</p>
            <p class="mt-2 text-4xl font-bold text-[#232321]">12</p>
        </div>

        <div class="rounded-2xl bg-white p-6 shadow-sm">
            <p class="text-sm text-[#6b6a66]">Proyectos activos</p>
            <p class="mt-2 text-4xl font-bold text-[#232321]">8</p>
        </div>

        <div class="rounded-2xl bg-white p-6 shadow-sm">
            <p class="text-sm text-[#6b6a66]">Publicaciones</p>
            <p class="mt-2 text-4xl font-bold text-[#232321]">24</p>
        </div>

    </div>


    <div class="grid gap-4 md:grid-cols-2 xl:grid-cols-4">

        <button data-screen="semilleros" class="rounded-2xl bg-white p-5 text-left shadow-sm transition hover:bg-[#eeeeea]">
            <p class="font-semibold">Semilleros</p>
            <p class="mt-2 text-sm text-[#6b6a66]">Grupos de investigación estudiantil.</p>
        </button>

        <button data-screen="proyectos" class="rounded-2xl bg-white p-5 text-left shadow-sm transition hover:bg-[#eeeeea]">
            <p class="font-semibold">Proyectos</p>
            <p class="mt-2 text-sm text-[#6b6a66]">Iniciativas en curso y nuevas.</p>
        </button>

        <button data-screen="publicaciones" class="rounded-2xl bg-white p-5 text-left shadow-sm transition hover:bg-[#eeeeea]">
            <p class="font-semibold">Publicaciones</p>
            <p class="mt-2 text-sm text-[#6b6a66]">Artículos y productos de investigación.</p>
        </button>

        <button data-screen="eventos" class="rounded-2xl bg-white p-5 text-left shadow-sm transition hover:bg-[#eeeeea]">
            <p class="font-semibold">Eventos</p>
            <p class="mt-2 text-sm text-[#6b6a66]">Ponencias, ferias y encuentros.</p>
        </button>

        <button data-screen="convocatorias" class="rounded-2xl bg-white p-5 text-left shadow-sm transition hover:bg-[#eeeeea]">
            <p class="font-semibold">Convocatorias</p>
            <p class="mt-2 text-sm text-[#6b6a66]">Oportunidades abiertas para participar.</p>
        </button>

        <button data-screen="logros" class="rounded-2xl bg-white p-5 text-left shadow-sm transition hover:bg-[#eeeeea]">
            <p class="font-semibold">Logros</p>
            <p class="mt-2 text-sm text-[#6b6a66]">Reconocimientos del ecosistema RIUL.</p>
        </button>

        <button data-screen="ranking" class="rounded-2xl bg-white p-5 text-left shadow-sm transition hover:bg-[#eeeeea]">
            <p class="font-semibold">Ranking</p>
            <p class="mt-2 text-sm text-[#6b6a66]">Posición de semilleros e investigadores.</p>
        </button>

        <button data-screen="profile" class="rounded-2xl bg-white p-5 text-left shadow-sm transition hover:bg-[#eeeeea]">
            <p class="font-semibold">Perfil</p>
            <p class="mt-2 text-sm text-[#6b6a66]">Hoja de vida, XP e insignias.</p>
        </button>

    </div>

</section>

<section id="semilleros-screen" class="app-screen hidden space-y-6">

    <!-- Búsqueda y listado -->
    <div class="rounded-2xl bg-white p-6 shadow-sm">
        <div class="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">
            <div>
                <h2 class="text-2xl font-bold">Semilleros de investigación</h2>
                <p class="mt-2 text-sm text-[#6b6a66]">Busca un semillero, conoce su trabajo y solicita vincularte.</p>
            </div>
            <input id="semilleros-search" type="search" placeholder="Buscar por nombre, línea o descripción..." aria-label="Buscar semilleros"
                class="w-full rounded-lg border border-[#c9c8c2] px-4 py-2 text-sm lg:w-80">
        </div>
    </div>

    <div id="semilleros-list" class="grid gap-4 md:grid-cols-2 xl:grid-cols-3"></div>


    <!-- Detalle del semillero seleccionado -->
    <div id="semillero-detail" class="hidden space-y-6">

        <article class="rounded-2xl border border-[#d8d7d1] bg-white p-6 shadow-sm">
            <div class="flex flex-col gap-6 lg:flex-row lg:items-center lg:justify-between">

                <div class="flex items-start gap-5">
                    <div id="sd-iniciales" class="flex h-16 w-16 items-center justify-center rounded-full bg-[#dfe7f2] text-lg font-semibold text-[#0c447c]">SM</div>
                    <div>
                        <h2 id="sd-nombre" class="text-2xl font-bold text-[#232321]"></h2>
                        <p id="sd-descripcion" class="mt-1 max-w-2xl text-sm text-[#6b6a66]"></p>
                        <div class="mt-3 flex flex-wrap gap-2">
                            <span id="sd-linea" class="rounded-full bg-[#eaf3de] px-3 py-1 text-xs font-medium text-[#3b6d11]"></span>
                            <span id="sd-facultad" class="rounded-full bg-[#e6f1fb] px-3 py-1 text-xs font-medium text-[#0c447c]"></span>
                            <span id="sd-lider" class="rounded-full bg-[#eeeeea] px-3 py-1 text-xs font-medium text-[#3a3a38]"></span>
                        </div>
                    </div>
                </div>

                <div class="text-left lg:text-right">
                    <p id="sd-stars" class="text-xl text-[#c9a227]"></p>
                    <p id="sd-xp" class="text-xs text-[#6b6a66]"></p>
                    <div class="mt-3 flex flex-wrap gap-2 lg:justify-end">
                        <button id="join-semillero" type="button" class="rounded-md bg-[#3a3a38] px-5 py-2 text-sm font-medium text-white">Solicitar vinculación</button>
                        <button id="follow-semillero" type="button" class="rounded-md border border-[#c9c8c2] bg-[#eeeeea] px-5 py-2 text-sm font-medium text-[#3a3a38]">Seguir</button>
                        <button id="close-semillero" type="button" class="rounded-md border border-[#c9c8c2] bg-white px-5 py-2 text-sm font-medium text-[#3a3a38]">Cerrar</button>
                    </div>
                </div>

            </div>
        </article>

        <div class="flex flex-wrap gap-3" role="tablist">
            <button type="button" data-tab="publicaciones" class="semillero-tab rounded-xl bg-[#3a3a38] px-4 py-2 text-sm font-semibold text-white">Publicaciones</button>
            <button type="button" data-tab="proyectos" class="semillero-tab rounded-xl bg-slate-200 px-4 py-2 text-sm font-semibold text-slate-700">Proyectos</button>
            <button type="button" data-tab="integrantes" class="semillero-tab rounded-xl bg-slate-200 px-4 py-2 text-sm font-semibold text-slate-700">Integrantes</button>
            <button type="button" data-tab="logros" class="semillero-tab rounded-xl bg-slate-200 px-4 py-2 text-sm font-semibold text-slate-700">Logros</button>
        </div>

        <div id="sd-panel-publicaciones" class="semillero-panel space-y-3"></div>
        <div id="sd-panel-proyectos" class="semillero-panel hidden space-y-3"></div>
        <div id="sd-panel-integrantes" class="semillero-panel hidden space-y-3"></div>
        <div id="sd-panel-logros" class="semillero-panel hidden space-y-3"></div>

    </div>

</section>

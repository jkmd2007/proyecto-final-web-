<!DOCTYPE html>

<html lang="es">

<head>

    <!-- =====================================================
         CONFIGURACION DEL DOCUMENTO
    ====================================================== -->

    <meta charset="UTF-8">


    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >


    <!-- =====================================================
         TITULO DINAMICO
    ====================================================== -->

    <title>

        {% block title %}

            RIUL

        {% endblock %}

    </title>


    <!-- =====================================================
         TAILWIND CSS

         Para el proyecto académico utilizamos CDN.

         En producción recomendamos compilar Tailwind
         durante el proceso de construcción.
    ====================================================== -->

    <script
        src="https://cdn.tailwindcss.com">
    </script>


    <!-- =====================================================
         AXIOS

         Librería utilizada para consumir nuestra API REST.
    ====================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js">
    </script>


    <!-- =====================================================
         CSS PROPIO
    ====================================================== -->

    <link
        rel="stylesheet"
        href="{{ url_for(
            'static',
            filename='css/app.css'
        ) }}"
    >

</head>


<body class="min-h-screen bg-[#f1f0ec] text-[#232321]">


    <!-- =====================================================
         NAVBAR

         Partial reutilizable.
    ====================================================== -->

    {% include "partials/_navbar.html" %}


    <div class="pointer-events-none fixed right-4 top-4 z-50 w-full max-w-md">
        <div class="pointer-events-auto">
            {% include "partials/_alerts.html" %}
        </div>
    </div>


    <!-- =====================================================
         AUTENTICACIÓN

         Ocupa toda la pantalla según el wireframe de login.
    ====================================================== -->

    {% block auth %}

    {% endblock %}


    <!-- =====================================================
         CONTENIDO PRINCIPAL
    ====================================================== -->

    <main id="app-main" class="hidden mx-auto max-w-7xl px-6 py-8">


        <!-- =================================================
             BLOCK CONTENT

             Cada página puede reemplazar este contenido.
        ================================================== -->

        {% block content %}

        {% endblock %}

    </main>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script
        src="{{ url_for(
            'static',
            filename='js/api.js'
        ) }}"
    ></script>
    <script
        src="{{ url_for(
            'static',
            filename='js/app.js'
        ) }}"
    ></script>
    <script
        src="{{ url_for(
            'static',
            filename='js/roles.js'
        ) }}"
    ></script>

</body>

</html>
